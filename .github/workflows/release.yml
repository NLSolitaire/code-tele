name: Release The Whatever Downloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de publication (ex: 1.0.0). Laisser vide pour utiliser la version du tag ou de Directory.Build.props.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Distribution
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Execute automated distribution pipeline
        shell: powershell
        run: |
          # Résolution du script build-distribution.ps1 via wildcard (insensible aux encodages)
          $scriptPath = (Resolve-Path "*Downloader\build-distribution.ps1" -ErrorAction SilentlyContinue).Path
          if (-not $scriptPath) {
              $scriptPath = (Resolve-Path "build-distribution.ps1" -ErrorAction SilentlyContinue).Path
          }
          if (-not $scriptPath) {
              $found = Get-ChildItem -Path $PWD -Filter "build-distribution.ps1" -Recurse | Select-Object -First 1
              if ($found) { $scriptPath = $found.FullName }
          }
          if (-not $scriptPath) {
              throw "Script build-distribution.ps1 introuvable dans le dépôt !"
          }
          Write-Host "Script trouvé : $scriptPath" -ForegroundColor Cyan
          $scriptDir = Split-Path -Parent $scriptPath
          Set-Location $scriptDir
          Write-Host "Répertoire de travail : $scriptDir" -ForegroundColor Cyan

          # Résolution de la version
          $inputVersion = "${{ github.event.inputs.version }}"
          $refName = "${{ github.ref_name }}"
          $buildVersion = ""

          if (-not [string]::IsNullOrWhiteSpace($inputVersion)) {
              $buildVersion = $inputVersion.Trim().TrimStart('v')
          } elseif ($refName -match '^v?(\d+\.\d+(\.\d+)?)') {
              $buildVersion = $Matches[1]
          }

          Write-Host "Lancement de la distribution avec la version : '$buildVersion'" -ForegroundColor Cyan
          if (-not [string]::IsNullOrWhiteSpace($buildVersion)) {
              & $scriptPath -Version $buildVersion
          } else {
              & $scriptPath
          }

      - name: Locate Artifacts Directory
        id: locate_dist
        shell: powershell
        run: |
          $distPath = (Resolve-Path "*Downloader\dist" -ErrorAction SilentlyContinue).Path
          if (-not $distPath -or -not (Test-Path (Join-Path $distPath "SHA256SUMS.txt"))) {
              $sha = Get-ChildItem -Path $PWD -Filter "SHA256SUMS.txt" -Recurse | Select-Object -First 1
              if ($sha) { $distPath = $sha.Directory.FullName }
          }
          if (-not $distPath) {
              throw "Dossier dist introuvable après l'exécution du build."
          }
          Write-Host "Dossier dist trouvé : $distPath" -ForegroundColor Green
          "DIST_PATH=$distPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: The Whatever Downloader ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          tag_name: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.DIST_PATH }}/*-portable.zip
            ${{ env.DIST_PATH }}/*-Standalone-*.exe
            ${{ env.DIST_PATH }}/**/TheWhateverDownloader-*-Setup-*.exe
            ${{ env.DIST_PATH }}/SHA256SUMS.txt
